name: Import real wedding assets

on:
  push:
    branches: [staging]
    paths:
      - ".github/workflows/import-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert photos
        run: |
          set -e
          mkdir -p assets/tmp
          curl -L --fail --retry 3 "https://images.pexels.com/photos/33417234/pexels-photo-33417234.jpeg?cs=srgb&dl=pexels-thevisionaryvows-33417234.jpg&fm=jpg" -o assets/tmp/hero.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/33417236/pexels-photo-33417236.jpeg?cs=srgb&dl=pexels-thevisionaryvows-33417236.jpg&fm=jpg" -o assets/tmp/entrance.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/39797465/pexels-photo-39797465.jpeg?cs=srgb&dl=pexels-aumgraphy-39797465.jpg&fm=jpg" -o assets/tmp/mandapam.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/5599007/pexels-photo-5599007.jpeg?cs=srgb&dl=pexels-tasprint-5599007.jpg&fm=jpg" -o assets/tmp/detail.jpg
          ffmpeg -y -i assets/tmp/hero.jpg -vf "scale=1600:900:force_original_aspect_ratio=increase,crop=1600:900" -c:v libwebp -quality 82 assets/hero-mandapam.webp
          ffmpeg -y -i assets/tmp/entrance.jpg -vf "scale=1200:1500:force_original_aspect_ratio=increase,crop=1200:1500" -c:v libwebp -quality 82 assets/entrance.webp
          ffmpeg -y -i assets/tmp/mandapam.jpg -vf "scale=1200:1500:force_original_aspect_ratio=increase,crop=1200:1500" -c:v libwebp -quality 82 assets/mandapam.webp
          ffmpeg -y -i assets/tmp/detail.jpg -vf "scale=1200:1500:force_original_aspect_ratio=increase,crop=1200:1500" -c:v libwebp -quality 82 assets/floral-detail.webp
          rm -rf assets/tmp
          cat > assets/SOURCES.md <<'EOF'
# Real image assets

Optimized WebP assets selected from Pexels to match Varnam's crimson-red and antique-gold Indian wedding direction.

- hero-mandapam.webp — Pexels 33417234
- entrance.webp — Pexels 33417236
- mandapam.webp — Pexels 39797465
- floral-detail.webp — Pexels 5599007

The source photos are used as references/assets under Pexels' applicable license terms; no Pinterest watermark removal or exact Pinterest image copying is used.
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Add real wedding WebP assets [assets]"
          git push origin staging
